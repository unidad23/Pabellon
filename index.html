<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pabellón</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pabellón">
<meta name="theme-color" content="#1f4e79">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1a1f24;--muted:#5d6a76;--accent:#1f4e79;--ok:#2e7d32;--full:#c62828;--line:#d7dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1c242c;--text:#eef2f5;--muted:#9aa8b4;--accent:#6aa9e0;--ok:#66bb6a;--full:#ef5350;--line:#2c3742}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1c242c;--text:#eef2f5;--muted:#9aa8b4;--accent:#6aa9e0;--ok:#66bb6a;--full:#ef5350;--line:#2c3742}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--accent);color:#fff;padding:12px 16px;z-index:5}
header h1{margin:0;font-size:20px}
#resumen{font-size:14px;opacity:.95;margin-top:2px}
main{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:900px;margin:0 auto}
.celda{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.celda h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.cupo{font-size:13px;font-weight:600;color:var(--ok)}
.celda.llena .cupo{color:var(--full)}
ul{list-style:none;margin:0;padding:0;min-height:20px}
li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px;word-break:break-word}
li button{background:none;border:none;color:var(--full);font-size:18px;padding:2px 8px;cursor:pointer}
.vacio{color:var(--muted);font-size:13px}
button.add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:15px;cursor:pointer}
button.add:disabled{opacity:.4}
input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
footer{padding:12px;text-align:center}
.celda{border-left-width:8px}
.celda.verde{border-left-color:#2e7d32}.celda.amarillo{border-left-color:#f9a825}.celda.rojo{border-left-color:#c62828}
.celda .cupo{padding:2px 8px;border-radius:10px;color:#fff;font-size:13px}
.celda.verde .cupo{background:#2e7d32}.celda.amarillo .cupo{background:#f9a825;color:#1a1f24}.celda.rojo .cupo{background:#c62828}
li{flex-wrap:wrap}
li .acc{display:flex;gap:10px;align-items:center;margin-top:2px}
li button.mv{color:var(--accent);font-size:13px}
li button.eg{font-size:13px}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;max-width:100%}
#resumen{font-weight:600}
.per{display:flex;flex-direction:column;flex:1 1 100%;min-width:0;word-break:normal;overflow-wrap:anywhere}
.per small{color:var(--muted);font-size:12px}
.per b{font-weight:600}
.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
#q{width:calc(100% - 92px);margin-top:8px;padding:10px;border-radius:8px;border:none;font-size:16px;background:#fff;color:#1a1f24}
#res{max-height:45vh;overflow-y:auto;margin-top:6px}
#qb{width:84px;margin-left:6px;padding:10px 0;border-radius:8px;border:none;font-size:16px;background:#0d3b66;color:#fff}
#res button.r{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:6px;font-size:16px}
#res .nada{color:#fff;padding:6px 2px}
.per{cursor:pointer}
#ficha{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
#ficha.on{display:block}
#ficha h2{margin:0 0 4px}
#ficha label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
#ficha input,#ficha select,#ficha textarea{width:100%;margin-top:3px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
#ficha textarea{min-height:70px}
#ficha .vb{background:none;border:none;color:var(--accent);font-size:17px;padding:8px 0;margin-bottom:4px;width:auto}
#ficha .bt{display:flex;gap:10px;margin-top:16px}
#ficha .bt button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);font-size:16px;background:var(--card);color:var(--text)}
footer button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;font-size:14px}
#resp textarea{width:100%;min-height:120px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
#resp button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Pabellón</h1><div id="resumen"></div><input id="q" type="search" placeholder="Buscar persona…" autocomplete="off"><button id="qb">Buscar</button><div id="res"></div></header>
<main id="celdas"></main>
<footer><button id="bk">Respaldo / Restaurar</button> <button id="vaciar">Vaciar todo</button></footer>
<div id="resp" style="display:none;padding:12px"><p>Copiá este texto y guardalo (por ejemplo en una nota). Para restaurar, pegá el texto acá y tocá Restaurar.</p><textarea id="rt"></textarea><button id="rok">Restaurar desde este texto</button> <button id="rno">Cerrar</button></div>
<div id="ficha"></div>
<script>
var N=14, MAX=5, KEY="pabellon:celdas";
var moviendo=null;
var datos=cargar();
function cargar(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(Array.isArray(d)&&d.length===N)return d.map(function(c){return c.map(function(p){return typeof p==="string"?{n:p,p:hoy(),c:hoy()}:p;});});}}catch(e){}
  var v=[];for(var i=0;i<N;i++)v.push([]);return v;
}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(datos));}catch(e){}}
function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function buscar(){
  var q=norm(document.getElementById('q').value.trim()),r=document.getElementById('res');r.innerHTML='';
  if(!q)return;
  var ws=q.split(/\s+/),n=0;
  datos.forEach(function(c,i){c.forEach(function(p,j){
    var hay=norm(p.n+' '+(p.l||''));
    if(ws.every(function(w){return hay.indexOf(w)>=0;})){n++;
      var b=document.createElement('button');b.className='r';b.textContent=p.n+' — Celda C'+(i+1);
      b.onclick=function(){abrirFicha(i,j);};r.appendChild(b);}
  });});
  if(!n){var d=document.createElement('div');d.className='nada';d.textContent='No está cargado en ninguna celda.';r.appendChild(d);}
}
function opt(v,sel){return '<option'+(v===sel?' selected':'')+'>'+v+'</option>';}
function abrirFicha(i,j){
  var p=datos[i][j],f=document.getElementById('ficha');
  var T=['Ninguno','Talleres','Parque y jardín','Cocina','Micro','Otro'],E=['No estudia','Primaria','Secundaria','Otro'];
  f.innerHTML='<button id="f_back" class="vb">← Volver</button><h2></h2><div>Celda C'+(i+1)+'</div>'+
  '<label>Nombre y apellido<input id="f_n" maxlength="60"></label>'+
  '<label>Legajo (nro. interno)<input id="f_l" maxlength="20"></label>'+
  '<label>Ingreso al pabellón<input id="f_p" type="date"></label>'+
  '<label>Ingreso a la celda<input id="f_c" type="date"></label>'+
  '<label>Trabajo<select id="f_t">'+T.map(function(v){return opt(v,p.t||'Ninguno');}).join('')+'</select></label>'+
  '<label>Horario de trabajo<input id="f_th" maxlength="40"></label>'+
  '<label>Estudio<select id="f_e">'+E.map(function(v){return opt(v,p.e||'No estudia');}).join('')+'</select></label>'+
  '<label>Horario de estudio<input id="f_eh" maxlength="40"></label>'+
  '<label>Cursos realizados<textarea id="f_cr"></textarea></label>'+
  '<label>Curso que está haciendo<input id="f_cc" maxlength="80"></label>'+
  '<label>Actividades diarias<textarea id="f_a"></textarea></label>'+
  '<label>Observaciones<textarea id="f_o"></textarea></label>'+
  '<div class="bt"><button id="f_ok" style="background:var(--accent);color:#fff;border:none">Guardar</button><button id="f_no">Cancelar</button></div>';
  var set=function(id,v){document.getElementById(id).value=v||'';};
  set('f_n',p.n);set('f_l',p.l);set('f_p',p.p);set('f_c',p.c);set('f_th',p.th);set('f_eh',p.eh);set('f_cr',p.cr);set('f_cc',p.cc);set('f_a',p.a);set('f_o',p.o);
  f.querySelector('h2').textContent=p.n;f.classList.add('on');f.scrollTop=0;try{history.pushState({ficha:1},'');}catch(e){}document.getElementById('f_back').onclick=cerrarFicha;
  document.getElementById('f_no').onclick=cerrarFicha;
  document.getElementById('f_ok').onclick=function(){
    var g=function(id){return document.getElementById(id).value;};
    var n=g('f_n').trim();if(!n)return;
    p.n=n;p.l=g('f_l').trim();p.p=g('f_p')||p.p;p.c=g('f_c')||p.c;p.t=g('f_t');p.th=g('f_th');p.e=g('f_e');p.eh=g('f_eh');p.cr=g('f_cr');p.cc=g('f_cc');p.a=g('f_a');p.o=g('f_o');
    guardar();dibujar();cerrarFicha();
  };
}
document.getElementById('q').oninput=buscar;document.getElementById('qb').onclick=buscar;document.getElementById('q').onkeydown=function(e){if(e.key==='Enter')buscar();};
function cerrarFicha(){var f=document.getElementById('ficha');f.classList.remove('on');try{if(history.state&&history.state.ficha)history.back();}catch(e){}}
window.addEventListener('popstate',function(){document.getElementById('ficha').classList.remove('on');});
function hoy(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function fmt(s){var a=(s||"").split("-");return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:"s/d";}
function antig(s){var a=(s||"").split("-");if(a.length!==3)return "";var d0=new Date(+a[0],+a[1]-1,+a[2]),t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());if(d0>t)return "fecha futura";var y=t.getFullYear()-d0.getFullYear(),m=t.getMonth()-d0.getMonth(),d=t.getDate()-d0.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate();}if(m<0){y--;m+=12;}if(y>0)return y+" a "+m+" m";if(m>0)return m+" m "+d+" d";return d+" d";}
function dibujar(){
  var cont=document.getElementById("celdas");cont.innerHTML="";
  var total=0;
  datos.forEach(function(c,i){
    total+=c.length;
    var llena=c.length>=MAX;
    var div=document.createElement("section");
    div.className="celda "+(c.length>=MAX?"rojo":c.length>=4?"amarillo":"verde");
    var h=document.createElement("h2");
    h.innerHTML="<span>C"+(i+1)+"</span><span class='cupo'>"+c.length+"/"+MAX+(llena?" LLENA":"")+"</span>";
    div.appendChild(h);
    var ul=document.createElement("ul");
    if(!c.length){var e=document.createElement("li");e.innerHTML="<span class='vacio'>Vacía</span>";ul.appendChild(e);}
    c.forEach(function(nombre,j){
      var li=document.createElement("li");
      var s=document.createElement("span");s.className="per";s.innerHTML="<b></b><small>Pabellón: "+fmt(nombre.p)+" · "+antig(nombre.p)+"</small><small>Celda: "+fmt(nombre.c)+" · "+antig(nombre.c)+"</small>"+(nombre.t&&nombre.t!=="Ninguno"?"<small>Trabajo: "+nombre.t+"</small>":"")+(nombre.e&&nombre.e!=="No estudia"?"<small>Estudia: "+nombre.e+"</small>":"");s.firstChild.textContent=nombre.n;s.onclick=function(){abrirFicha(i,j);};
      var b=document.createElement("button");b.className="eg";b.textContent="Egresar";b.setAttribute("aria-label","Egresar a "+nombre.n);var m=document.createElement("button");m.className="mv";m.textContent="Mover";m.onclick=function(){moviendo={i:i,j:j};dibujar();};
      b.onclick=function(){if(b.dataset.ok){datos[i].splice(j,1);guardar();dibujar();}else{b.dataset.ok="1";b.textContent="¿Seguro?";setTimeout(function(){b.dataset.ok="";b.textContent="Egresar";},3000);}};
      var acc=document.createElement("span");acc.className="acc";
      if(moviendo&&moviendo.i===i&&moviendo.j===j){
        var sel=document.createElement("select");
        var o0=document.createElement("option");o0.value="";o0.textContent="Mover a…";sel.appendChild(o0);
        datos.forEach(function(cc,k){if(k!==i&&cc.length<MAX){var o=document.createElement("option");o.value=k;o.textContent="C"+(k+1)+" ("+cc.length+"/"+MAX+")";sel.appendChild(o);}});
        sel.onchange=function(){if(sel.value!==""){var k=parseInt(sel.value,10);if(datos[k].length<MAX){var q=datos[i].splice(j,1)[0];q.c=hoy();datos[k].push(q);}moviendo=null;guardar();dibujar();}};
        var x=document.createElement("button");x.textContent="✕";x.onclick=function(){moviendo=null;dibujar();};
        acc.appendChild(sel);acc.appendChild(x);
      }else{acc.appendChild(m);acc.appendChild(b);}
      li.appendChild(s);li.appendChild(acc);ul.appendChild(li);
    });
    div.appendChild(ul);
    var inp=document.createElement("input");inp.type="text";inp.maxLength=40;inp.placeholder=llena?"Celda llena":"Nombre";inp.disabled=llena;
    var dp=document.createElement("input");dp.type="date";dp.value=hoy();dp.disabled=llena;var dc=document.createElement("input");dc.type="date";dc.value=hoy();dc.disabled=llena;
    var lp=document.createElement("label");lp.className="f";lp.textContent="Ingreso al pabellón";var lc=document.createElement("label");lc.className="f";lc.textContent="Ingreso a la celda";
    var a=document.createElement("button");a.className="add";a.textContent="+ Agregar persona";a.disabled=llena;
    a.onclick=function(){
      var n=inp.value;
      if(n&&n.trim()&&datos[i].length<MAX){datos[i].push({n:n.trim(),p:dp.value||hoy(),c:dc.value||hoy()});guardar();dibujar();}
    };
    div.appendChild(inp);lp.appendChild(dp);lc.appendChild(dc);div.appendChild(lp);div.appendChild(lc);div.appendChild(a);inp.onkeydown=function(ev){if(ev.key==="Enter"&&a.onclick)a.onclick();};
    cont.appendChild(div);
  });
  document.getElementById("resumen").textContent="Capacidad "+(N*MAX)+" · Ocupados "+total+" · Libres "+(N*MAX-total);buscar();
}
document.getElementById("vaciar").onclick=function(){
  var bt=document.getElementById("vaciar");if(bt.dataset.ok){datos=[];for(var i=0;i<N;i++)datos.push([]);guardar();dibujar();bt.dataset.ok="";bt.textContent="Vaciar todo";}else{bt.dataset.ok="1";bt.textContent="Tocá de nuevo para vaciar TODO";setTimeout(function(){bt.dataset.ok="";bt.textContent="Vaciar todo";},3000);}
};
dibujar();
document.getElementById('bk').onclick=function(){var t=JSON.stringify(datos),a=document.getElementById('rt');document.getElementById('resp').style.display='block';a.value=t;a.select();try{navigator.clipboard.writeText(t);}catch(e){}};
document.getElementById('rok').onclick=function(){try{var d=JSON.parse(document.getElementById('rt').value);if(Array.isArray(d)&&d.length===N){datos=d;guardar();dibujar();document.getElementById('resp').style.display='none';}}catch(e){}};
document.getElementById('rno').onclick=function(){document.getElementById('resp').style.display='none';};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
